name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - iunu

jobs:
  create-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.create-runner.outputs.label }}
    steps:
      - id: create-runner
        uses: iunu/gce-github-runner@iunu
        with:
          token: ${{ secrets.GH_PAT_TOKEN }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          machine_zone: ${{ vars.RUNNER_ZONE }}
          machine_zones: ${{ vars.RUNNER_ZONES }}
          machine_type: 't2d-standard-1'
          image_project: prj-c-runners-bc7b
          image_family: github-runner-ubuntu-2404-lts
          network: 'runner-net'
          subnet: 'runner-subnet'
          preemptible: true
          actions_preinstalled: true
          no_external_address: true
          shutdown_timeout: 5

  test-runner:
    needs: create-runner
    runs-on: ${{ needs.create-runner.outputs.label }}
    steps:
      - name: Runner job test
        run: echo "This runs on the GCE runner VM"

      - name: Verify preinstalled runner image
        run: |
          test -d /actions-runner
          test -x /actions-runner/config.sh
          test -x /actions-runner/svc.sh
          systemctl is-active actions.runner.*.service
